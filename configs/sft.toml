[runtime]
enable_mps_fallback = true
tokenizers_parallelism = false
pin_memory_on_cuda_only = true

[model]
model_id = "google/gemma-4-E4B-it"

[data]
source = "hub"
hub_repo = "lamm-mit/scientific-sft-grpo-data"
hub_config = "scientific_design_sft"
local_path = "data/processed/scientific_design_sft"

[output]
directory = "artifacts/gemma4-scientific-design-sft"
resume = "auto"

[lora]
rank = 16
alpha = 32
dropout = 0.05
target_modules = "all-linear"

[training]
num_train_epochs = 3
max_steps = -1
learning_rate = 1e-4
train_batch_size = 1
eval_batch_size = 1
gradient_accumulation_steps = 8
max_sequence_length = 1024
mps_pad_to_multiple_of = 128
other_pad_to_multiple_of = 8
mps_empty_cache_steps = 5
completion_only_loss = true
loss_type = "nll"
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
optimizer = "adamw_torch"
warmup_steps = 10
eval_strategy = "steps"
eval_steps = 25
save_strategy = "steps"
save_steps = 25
logging_steps = 5
logging_first_step = true
report_to = "none"
seed = 17

[inference]
max_new_tokens = 512
do_sample = false
temperature = 1.0
top_p = 1.0

[hub]
repo_id = "lamm-mit/scientific-sft-grpo-design-sft"
push = true
strategy = "all_checkpoints"
private = false
always_push = true
