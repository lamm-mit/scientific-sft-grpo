[runtime]
enable_mps_fallback = true
tokenizers_parallelism = false
pin_memory_on_cuda_only = true

[model]
model_id = "google/gemma-4-E4B-it"

[data]
source = "hub"
hub_repo = "lamm-mit/scientific-sft-grpo-data"
hub_config = "scientific_design_grpo"
local_path = "data/processed/scientific_design_grpo"

[adapter]
source = "hub"
hub_repo = "lamm-mit/scientific-sft-grpo-design-sft"
local_path = "artifacts/gemma4-scientific-design-sft"

[output]
directory = "artifacts/gemma4-scientific-design-grpo"
resume = "auto"

[reward]
judge_model = "gpt-5.6-luna"
cache_path = "results/scientific_design_judge_cache.jsonl"
format_base_reward = 0.10
semantic_reward_weight = 0.90
function_weights = [1.0]
openai_max_retries = 3
openai_timeout_seconds = 120.0

[training]
num_train_epochs = 1
max_steps = -1
learning_rate = 5e-6
train_batch_size = 1
eval_batch_size = 4
gradient_accumulation_steps = 4
num_generations = 4
num_generations_eval = 4
max_completion_length = 512
temperature = 0.8
top_p = 0.95
top_k = 0
beta = 0.0
scale_rewards = "group"
multi_objective_aggregation = "sum_then_normalize"
loss_type = "dapo"
gradient_checkpointing = true
gradient_checkpointing_use_reentrant = false
optimizer = "adamw_torch"
warmup_steps = 5
eval_strategy = "epoch"
save_strategy = "steps"
save_steps = 25
logging_steps = 1
logging_first_step = true
log_completions = true
num_completions_to_print = 4
report_to = "none"
use_vllm = false
seed = 17

[inference]
max_new_tokens = 512
do_sample = false
temperature = 1.0
top_p = 1.0

[hub]
repo_id = "lamm-mit/scientific-sft-grpo-design-grpo"
push = true
strategy = "all_checkpoints"
private = false
always_push = true
