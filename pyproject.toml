[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-sft-grpo"
version = "0.4.0"
description = "Task-only scientific problem-solving datasets, LoRA SFT, and Luna-judged GRPO"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "huggingface-hub>=1.2",
  "jupyterlab>=4.4",
  "matplotlib>=3.9",
  "nbformat>=5.10",
  "openai==2.46.0",
  "packaging>=24.2",
  "pandas>=2.2",
  "peft==0.19.1",
  "pyarrow>=18",
  "pydantic==2.13.4",
  "seaborn>=0.13",
  "torch>=2.7",
  "tqdm>=4.67",
  "transformers==5.14.1",
  "trl==1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/lamm-mit/scientific-sft-grpo"
Documentation = "https://huggingface.co/docs/trl"
Dataset = "https://huggingface.co/datasets/lamm-mit/scientific-sft-grpo-data"

[project.scripts]
scientific-sft-grpo = "science_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
